id: B7.3
baf: B7
level: trap
instruction: По policy.yaml выясни, есть ли у роли Z доступ к Q в prod. Используется правило с наибольшим числом priority. Разрешение и запрет с равным
  наибольшим приоритетом означают конфликт. Запиши в answer.txt ALLOW, DENY или CONFLICT. При CONFLICT на второй строке запиши идентификаторы двух конфликтующих
  правил через пробел в порядке возрастания.
answer_file: answer.txt
